<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/images/tuneup-icon.svg" />
    <title>Tune Up</title>

    <!-- Mukta, as in the original -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      Font Awesome via the public CDN rather than the personal kit script that
      was hardcoded in all three original templates. Kits are tied to an
      account and allowlisted per domain, so the kit ID would have stopped
      resolving the moment this was hosted anywhere else.
    -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
